# BoT-SORT tracker defaults for mode="track"
# Docs: https://docs.ultralytics.com/modes/track/

# ─────────────────────────────────────────────────────────────────
# backend/botsort_static.yaml
# Salinan ultralytics/cfg/trackers/botsort.yaml (Ultralytics 8.4.18).
# SATU-SATUNYA nilai yang berbeda: gmc_method = none.
#
# OPSIONAL (opt-in), BUKAN default. Default backend/processor.py tetap
# "botsort.yaml" bawaan Ultralytics (dengan GMC), sama seperti kode
# semula. File ini baru dipakai bila diminta lewat environment variable:
#     PARKING_TRACKER=botsort_static.yaml
#
# Yang dihemat: GMC (global motion compensation) menjalankan optical
# flow pada setiap frame untuk mengompensasi gerak KAMERA. Tanpa GMC
# satu tick lebih cepat sekitar 20-70 ms (terukur di laptop
# pengembangan, frame 720p). Itu kecil dibanding waktu inferensi YOLO.
#
# Risikonya: hasil tracking TIDAK identik dengan default, walaupun
# kameranya diam. Pada video uji (input4.mp4), 12 dari 60 tick pertama
# dan 42 dari 345 tick (satu putaran penuh) menghasilkan daftar alert
# yang berbeda: logical id dan durasi parkir satu kendaraan (yang
# kelasnya berpindah-pindah antara car dan truck) berubah. Pakai file
# ini hanya bila selisih seperti itu bisa diterima; kalau ragu, biarkan
# default.
# ─────────────────────────────────────────────────────────────────

tracker_type: botsort # (str) Tracker backend: botsort|bytetrack; choose botsort to enable BoT-SORT features
track_high_thresh: 0.25 # (float) First-stage match threshold; raise for cleaner tracks, lower to keep more
track_low_thresh: 0.1 # (float) Second-stage threshold for low-score matches; balances recovery vs drift
new_track_thresh: 0.25 # (float) Start a new track if no match ≥ this; higher reduces false tracks
track_buffer: 30 # (int) Frames to keep lost tracks alive; higher handles occlusion, increases ID switches risk
match_thresh: 0.8 # (float) Association similarity threshold (IoU/cost); tune with detector quality
fuse_score: True # (bool) Fuse detection score with motion/IoU for matching; stabilizes weak detections

# BoT-SORT specifics
gmc_method: none # (str) Global motion compensation: sparseOptFlow|orb|sift|ecc|none; helps moving camera scenes

# ReID model related thresh
proximity_thresh: 0.5 # (float) Min IoU to consider tracks proximate for ReID; higher is stricter
appearance_thresh: 0.8 # (float) Min appearance similarity for ReID; raise to avoid identity swaps
with_reid: False # (bool) Enable ReID model use; needs extra model and compute
model: auto # (str) ReID model name/path; "auto" uses detector features if available
